# LiteLLM gateway: annotated example config (DB-less mode).
#
# This is the shape of the production gateway fronting every model on the
# serving node. Secrets resolve from the environment (os.environ/...), never
# in-file. Run DB-less (no database_url): routing, keys and aliases live in
# this file, which makes the gateway state git-manageable.
#
# Key patterns demonstrated:
#   1. every backend pins a per-task model name (no fall-through to a default
#      heavy model; see postmortems/2026-08-31-aux-compaction-stall.md)
#   2. background/batch aliases get explicit rpm + max_parallel_requests caps
#   3. a multi-deployment logical group ("background-llm"): the aux GPU is the
#      heavy-weight normal destination; the interactive TP2 deployment sits in
#      the same group as a heavily capped low-weight overflow member (rate
#      limits + max_parallel_requests: 1). Weight is a
#      selection probability, which is why the caps, not the weight, are what
#      protect interactive traffic. The TP2 member therefore provides heavily
#      capped overflow capacity, including during aux-GPU saturation or
#      maintenance. For strict isolation, remove the TP2
#      member entirely and route overflow explicitly instead.
#   4. model_info.max_input_tokens published per model so clients can discover
#      context windows from /v1/models (version-gated: needs LiteLLM >= 1.9x)
#   5. thinking-mode control via chat_template_kwargs per route, with an
#      adaptive (unpinned) default; see README "adaptive reasoning"
#
# Auth wiring: each deployment's api_key must equal the backend's own bearer
# key. vLLM enforces auth only from --api-key or the literal VLLM_API_KEY
# variable name, so the compose examples map the per-service secret to that
# name (serving/compose.env.example); this file reads the same values from
# the gateway's environment.

model_list:
  # ---- interactive tier: the primary chat model, TP2 on dedicated GPUs ----
  - model_name: primary-chat
    litellm_params:
      model: openai/primary-chat
      api_base: http://serving-host:8000/v1
      api_key: os.environ/VLLM_API_KEY_PRIMARY
      request_timeout: 1200
      max_retries: 2
      # vLLM MTP speculative decoding rejects min_p / logit_bias (some clients send them)
      additional_drop_params: ["min_p", "logit_bias"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
          thinking: true
          # No reasoning_effort pin here: the template scales thinking to the
          # task (adaptive). Pinning "high" underthinks hard prompts; "max"
          # burns tokens on easy ones (measured: README "Routing").
    model_info:
      max_input_tokens: 131072
    router_params:
      routing_strategy: latency-based-routing
      allowed_fallbacks: []

  # ---- auxiliary tier: small MoE on its own GPU (workload isolation) ----
  - model_name: aux-35b
    litellm_params:
      model: openai/aux-35b
      api_base: http://serving-host:8001/v1
      api_key: os.environ/VLLM_API_KEY_AUX
      request_timeout: 600
      max_retries: 2
      additional_drop_params: ["min_p", "logit_bias"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
          thinking: false
    model_info:
      max_input_tokens: 262144
    router_params:
      routing_strategy: latency-based-routing
      allowed_fallbacks: []

  # ---- vision sidecar ----
  - model_name: vision
    litellm_params:
      model: openai/vision-model
      api_base: http://serving-host:8090/v1
      api_key: os.environ/VLLM_API_KEY_VISION
      request_timeout: 600
      max_retries: 2
      additional_drop_params: ["min_p", "logit_bias"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
          thinking: false
    model_info:
      max_input_tokens: 262144
    router_params:
      routing_strategy: latency-based-routing
      allowed_fallbacks: []

  # ---- background tier: multi-deployment group, weighted, capped ----
  # Same model_name = one logical group with multiple deployments. Weight 10
  # rides the aux GPU (independent of TP2). The TP2 member is capped overflow
  # capacity: rpm 4 + max_parallel_requests 1 bound what it can take from
  # interactive traffic when it IS selected (weight 1 of 11 picks). If you
  # need the isolation rule to have zero exceptions, delete this member and
  # keep background strictly on the independent GPU.
  - model_name: background-llm
    litellm_params:
      model: openai/aux-35b
      api_base: http://serving-host:8001/v1
      api_key: os.environ/VLLM_API_KEY_AUX
      request_timeout: 60
      max_retries: 0
      rpm: 8
      max_parallel_requests: 1
      weight: 10
      additional_drop_params: ["min_p", "logit_bias"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    model_info:
      max_input_tokens: 262144
    router_params:
      routing_strategy: latency-based-routing
      allowed_fallbacks: []
  - model_name: background-llm
    litellm_params:
      model: openai/primary-chat
      api_base: http://serving-host:8000/v1
      api_key: os.environ/VLLM_API_KEY_PRIMARY
      request_timeout: 90
      max_retries: 0
      rpm: 4
      max_parallel_requests: 1
      weight: 1
      additional_drop_params: ["min_p", "logit_bias"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    model_info:
      max_input_tokens: 131072
    router_params:
      routing_strategy: latency-based-routing
      allowed_fallbacks: []

  # ---- per-task pins: background task types NEVER fall through ----
  # Each aux task class (summarisation, titling, extraction, triage, ...)
  # gets its own alias pinned to the aux tier. This is the fix for the
  # compaction-stall incident: no un-pinned route reaches the primary pair.
  - model_name: aux-task-summarise
    litellm_params:
      model: openai/aux-35b
      api_base: http://serving-host:8001/v1
      api_key: os.environ/VLLM_API_KEY_AUX
      request_timeout: 120
      max_retries: 1
      rpm: 20
    model_info:
      max_input_tokens: 262144
    router_params:
      routing_strategy: simple-shuffle
      allowed_fallbacks: []

  # ---- nothink variant of the primary (quality-curated background work) ----
  - model_name: primary-chat-nothink
    litellm_params:
      model: openai/primary-chat
      api_base: http://serving-host:8000/v1
      api_key: os.environ/VLLM_API_KEY_PRIMARY
      request_timeout: 600
      max_retries: 2
      additional_drop_params: ["min_p", "logit_bias"]
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
          thinking: false
    model_info:
      max_input_tokens: 131072
    router_params:
      routing_strategy: latency-based-routing
      allowed_fallbacks: []

  # ---- embeddings: two-lane design (GPU ingest, CPU query) ----
  # INGEST lane: vLLM on the GPU, started on demand for batch ingestion and
  # stopped after (~1.1 GiB VRAM freed between runs). Never takes query traffic.
  - model_name: emb-ingest
    litellm_params:
      model: openai/Qwen3-Embedding-0.6B
      api_base: http://serving-host:8016/v1
      api_key: ""
      request_timeout: 300
      max_retries: 1
    router_params:
      routing_strategy: simple-shuffle
      allowed_fallbacks: []

  # QUERY lane: always-on torch CPU sidecar (docker/rag-emb-cpu/), capped at
  # 4 threads / 8 GB. Contract: identical vectors to the GPU lane for
  # identical input (cosine 0.99994 verified; >= 0.99 swap gate before any
  # cutover). See design-decisions/001-two-lane-embeddings.md.
  - model_name: emb-query
    litellm_params:
      model: openai/qwen3-emb-0.6b-cpu
      api_base: http://embeddings-host:8017/v1
      api_key: ""
      request_timeout: 30
      max_retries: 1
    router_params:
      routing_strategy: simple-shuffle
      allowed_fallbacks: []

  # ---- cloud burst tier: NVIDIA Nemotron on Nebius Token Factory ----
  # Reached ONLY via the fallback chains in router_settings. Normal
  # operation = zero cloud traffic. Generic role-named alias: the backing
  # slug can move (Nano -> Super -> a newer release) without consumer
  # renames. The gate script (gateway/token_factory_check.py) reads model
  # slugs from the endpoint at run time, never hard-coded.
  - model_name: burst-nemotron
    litellm_params:
      model: nebius/nvidia/nemotron-3-nano
      api_key: os.environ/NEBIUS_API_KEY
      request_timeout: 300
      max_retries: 1
      additional_drop_params: ["min_p", "logit_bias"]
    model_info:
      max_input_tokens: 256000

# ---- logical aliases (router_settings, NOT top-level; v1.99+ reads it
#      only under router_settings; top-level is silently unread) ----
router_settings:
  model_group_alias:
    fast-chat: aux-35b            # cheap lane for callers that just need "a model"
    deep-chat: primary-chat
  # fail fast into fallbacks; a dead backend (GPU stack swap) cools down briefly
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 45
  # burst chains: local aliases stay primary; the cloud deployment fires only
  # on failure or cooldown. Normal operation = zero cloud traffic, and any
  # burst-tier hit is visible in tracing as an anomaly worth a look.
  fallbacks:
    - primary-chat: [burst-nemotron]
    - primary-chat-nothink: [burst-nemotron]
    - background-llm: [burst-nemotron]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # self-hosted tracing (optional): callback to a Langfuse instance
  # callbacks: langfuse
  drop_params: true
